name: release

# Tag a commit on main as vX.Y.Z and push the tag: the tag is checked against
# the versions in the sources, the car and PC builds run, the SD-card image is
# made, and a GitHub Release carries all of them.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check:
    # The tag must be the version written in the sources (docs 7.3), so the
    # number on the release, in its files and inside the programs is one and
    # the same, and a build of the same commit without the tag differs only
    # by the +g<commit> metadata.  It must also be on main.
    name: Tag matches the versions in the sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Compare
        run: |
          tag="${GITHUB_REF_NAME}"
          printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::tag $tag is not vX.Y.Z"; exit 1; }
          v="${tag#v}"
          car="$(sed -n 's/^set(RUMICAR_VERSION "\([^"]*\)".*/\1/p' car/CMakeLists.txt)"
          app="$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' pc/RumiCar.DriveManager/RumiCar.DriveManager.csproj)"
          manifest="$(sed -n 's/.*assemblyIdentity version="\([^"]*\)".*/\1/p' pc/RumiCar.DriveManager/app.manifest)"
          echo "tag $v, car/CMakeLists.txt $car, RumiCar.DriveManager.csproj $app, app.manifest $manifest"
          fail=0
          [ "$car" = "$v" ] || { echo "::error::car/CMakeLists.txt RUMICAR_VERSION is $car, the tag is $tag"; fail=1; }
          [ "$app" = "$v" ] || { echo "::error::RumiCar.DriveManager.csproj <Version> is $app, the tag is $tag"; fail=1; }
          [ "$manifest" = "$v.0" ] || { echo "::error::app.manifest assemblyIdentity version is $manifest, expected $v.0"; fail=1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$tag is not a commit on main"; fail=1; }
          [ "$fail" = 0 ] || { echo "Change the versions in a pull request, merge it, then tag that merge commit."; exit 1; }

  car:
    needs: check
    uses: ./.github/workflows/car.yml
  pc:
    needs: check
    uses: ./.github/workflows/pc.yml

  publish:
    name: GitHub Release
    needs: [car, pc]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect the release files
        run: |
          mkdir -p release
          cp artifacts/rumicar-zero2cam-deb-arm64/*.deb release/
          cp artifacts/rumicar-zero2cam-image/* release/
          (cd artifacts/RumiCarDriveManager-win-x64 && zip -r "../../release/RumiCarDriveManager-${GITHUB_REF_NAME}-win-x64.zip" .)
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -l release

      - name: Create or update the release
        # The release may already exist when the tag was made from the GitHub
        # "Releases" page: then the files are attached to it and notes are
        # added only if it has none.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "RumiCar Zero2Cam ${GITHUB_REF_NAME}"
            echo
            echo "- \`rumicar-zero2cam-*.img.xz\`: 標準 SD カードイメージ（Raspberry Pi OS Lite 64bit ＋ 車載ソフト。Raspberry Pi Imager の「Use custom」で書き込み）"
            echo "- \`rumicar-zero2cam_*_arm64.deb\`: 車載ソフトのパッケージ（既存の Raspberry Pi OS に入れる場合）"
            echo "- \`RumiCarDriveManager-*-win-x64.zip\`: PC の走行管理アプリ（Windows x64、単一の exe）"
            echo "- \`SHA256SUMS.txt\`: 各ファイルのダイジェスト"
            echo
            echo "初期設定：ユーザー rumicar / rumicar、SSH 有効、ホスト名 rumicar、Wi-Fi AP の SSID RumiCar（開放）、車のアドレス 10.42.0.1。詳細は docs/RumiCar-Zero2Cam 仕様書.docx。"
          } > notes.md
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json id > /dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME exists: attaching the files"
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber release/*
            if [ -z "$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json body --jq .body)" ]; then
              gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "RumiCar Zero2Cam $GITHUB_REF_NAME" --notes-file notes.md
            fi
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "RumiCar Zero2Cam $GITHUB_REF_NAME" --notes-file notes.md release/*
          fi
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | "\(.name) \(.size) bytes"'
