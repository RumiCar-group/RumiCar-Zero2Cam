name: car

on:
  push:
    branches: [main]
    paths: ['car/**', '.github/workflows/car.yml']
  pull_request:
    paths: ['car/**', '.github/workflows/car.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # arm64 is the car (Raspberry Pi Zero 2 W, 64-bit Raspberry Pi OS = Debian 13 "trixie"
          # plus the Raspberry Pi archive, which supplies the libcamera the car runs).
          - runner: ubuntu-24.04-arm
            arch: arm64
            camera: "ON"
            publish: true
          # amd64 is a second compiler pass for warnings and tests only (no Raspberry Pi libcamera).
          - runner: ubuntu-24.04
            arch: amd64
            camera: "OFF"
            publish: false
    runs-on: ${{ matrix.runner }}
    container: debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install the same packages as on the car
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config git ca-certificates curl gnupg python3 \
            libgpiod-dev nlohmann-json3-dev libssl-dev libturbojpeg0-dev
          echo "gcc:       $(gcc --version | head -1)"
          echo "cmake:     $(cmake --version | head -1)"
          echo "libgpiod:  $(pkg-config --modversion libgpiod)"
          echo "turbojpeg: $(pkg-config --modversion libturbojpeg)"

      - name: Add the Raspberry Pi archive and install libcamera (car build only)
        if: matrix.camera == 'ON'
        run: |
          # Failures are reported as annotations (the raw log is not always reachable).
          report() { echo "::error title=$1::$(tail -n 40 "$2" | sed ':a;N;$!ba;s/\n/%0A/g')"; exit 1; }
          curl -fsSL https://archive.raspberrypi.com/debian/raspberrypi.gpg.key -o /tmp/raspberrypi.gpg.key 2>&1 | tee /tmp/key.log \
            || report "key download failed" /tmp/key.log
          gpg --dearmor -o /usr/share/keyrings/raspberrypi-archive-keyring.gpg /tmp/raspberrypi.gpg.key
          echo "deb [signed-by=/usr/share/keyrings/raspberrypi-archive-keyring.gpg] https://archive.raspberrypi.com/debian/ trixie main" \
            > /etc/apt/sources.list.d/raspi.list
          apt-get update > /tmp/update.log 2>&1 || report "apt-get update failed" /tmp/update.log
          apt-cache policy libcamera-dev libcamera0.7 | tee /tmp/policy.log
          apt-get install -y --no-install-recommends libcamera-dev > /tmp/install.log 2>&1 || report "libcamera-dev install failed" /tmp/install.log
          tail -n 5 /tmp/install.log
          echo "libcamera: $(pkg-config --modversion libcamera)"

      - uses: actions/checkout@v6

      - name: Configure
        run: cmake -S car -B build -DCMAKE_BUILD_TYPE=Release -DRUMICAR_WITH_CAMERA=${{ matrix.camera }}

      - name: Build (all warnings are errors)
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Verify the bundled base pack
        run: python3 car/tools/make_manifest.py verify car/packs/base

      - name: Stage an install tree
        if: matrix.publish
        run: |
          DESTDIR="$PWD/stage" cmake --install build --prefix /usr/local
          ver="$(sed -n 's/^set(TOF_DRIVE_VERSION "\([^"]*\)").*/\1/p' car/logic/CMakeLists.txt)"
          test -n "$ver"
          python3 car/tools/make_manifest.py logic "stage/usr/local/lib/rumicar/logic/tof_drive-$ver" \
            --name tof_drive --version "$ver" --entry libtof_drive.so
          python3 car/tools/make_manifest.py verify "stage/usr/local/lib/rumicar/logic/tof_drive-$ver"
          find stage -type f | sort

      - name: Upload car install tree
        if: matrix.publish
        uses: actions/upload-artifact@v5
        with:
          name: car-${{ matrix.arch }}
          path: stage
          if-no-files-found: error
