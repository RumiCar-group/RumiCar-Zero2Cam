name: pc

on:
  push:
    branches: [main]
    paths: ['pc/**', '.github/workflows/pc.yml']
  pull_request:
    paths: ['pc/**', '.github/workflows/pc.yml']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: build (windows x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore pc/RumiCar.sln

      - name: Build (all warnings are errors)
        run: dotnet build pc/RumiCar.sln --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test pc/RumiCar.Protocol.Tests/RumiCar.Protocol.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=protocol.trx"

      - name: Version (a release tag vX.Y.Z gives X.Y.Z; any other build gets +g<commit>)
        id: version
        shell: bash
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && printf '%s' "${GITHUB_REF_NAME}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "flag=-p:Version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "version ${GITHUB_REF_NAME#v} (release)"
          else
            v="$(sed -n 's:.*<Version>\([0-9.]*\)</Version>.*:\1:p' pc/RumiCar.DriveManager/RumiCar.DriveManager.csproj)"
            sha="${{ github.event.pull_request.head.sha || github.sha }}"
            echo "flag=-p:InformationalVersion=${v}+g${sha:0:7}" >> "$GITHUB_OUTPUT"
            echo "version ${v}+g${sha:0:7} (not a release)"
          fi

      - name: Publish the drive manager (single file, self-contained)
        run: >
          dotnet publish pc/RumiCar.DriveManager/RumiCar.DriveManager.csproj
          --configuration Release --runtime win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none --output publish ${{ steps.version.outputs.flag }}

      - name: Upload RumiCarDriveManager.exe
        uses: actions/upload-artifact@v5
        with:
          name: RumiCarDriveManager-win-x64
          path: publish
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: pc-test-results
          path: pc/RumiCar.Protocol.Tests/TestResults
          if-no-files-found: ignore
